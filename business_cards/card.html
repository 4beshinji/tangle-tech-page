<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Abe Shinji — Tangleteck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hubot+Sans:ital,wght@0,200..900;1,200..900&family=IBM+Plex+Sans+JP:wght@300;400;500;600;700&display=swap"
    />
    <style>
      :root {
        --paper: #f5f3ee;
        --ink: #0e0e0c;
        --ink-mid: #5a5852;
        --ink-faint: #a3a098;
        --rule: rgba(14, 14, 12, 0.18);
        --rule-strong: rgba(14, 14, 12, 0.42);
        --accent: #ff3b1c;

        --display:
          "Hubot Sans", "IBM Plex Sans JP", "Hiragino Sans",
          "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
        --jp:
          "IBM Plex Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN",
          system-ui, sans-serif;

        --bleed: 3mm;
        --w: 97mm;
        --h: 61mm;
        --safe-x: 6mm;
        --safe-y: 6mm;
      }

      @page {
        size: 97mm 61mm;
        margin: 0;
      }

      html, body {
        margin: 0;
        padding: 0;
        background: #ddd;
        font-family: var(--display);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        font-feature-settings: "palt" on;
      }

      .card {
        width: var(--w);
        height: var(--h);
        background: var(--paper);
        position: relative;
        overflow: hidden;
        page-break-after: always;
        font-size: 7pt;
        line-height: 1.5;
        color: var(--ink);
      }
      .card:last-child { page-break-after: auto; }

      .frame {
        position: absolute;
        inset: var(--safe-y) var(--safe-x);
        display: flex;
        flex-direction: column;
      }

      .accent { color: var(--accent); }
      .ink-mid { color: var(--ink-mid); }
      .ink-faint { color: var(--ink-faint); }

      hr.rule {
        border: 0;
        height: 0.3pt;
        background: var(--rule-strong);
        margin: 0;
      }

      .label {
        font-family: var(--display);
        font-size: 6pt;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      /* Shared bottom strip — pins both front and back rules to the same y. */
      .contact, .foot {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-top: 1.6mm;
        padding-top: 2.2mm;
        border-top: 0.3pt solid var(--rule);
        line-height: 1;
      }
      .contact .email,
      .contact .url,
      .foot .email,
      .foot .url {
        font-family: var(--display);
        font-size: 7pt;
        font-weight: 500;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
      }
      .contact .accent,
      .foot .accent {
        font-family: var(--display);
        font-size: 9pt;
        font-weight: 800;
      }

      /* ============== FRONT ============== */
      .front .meta {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .front .hero {
        margin-top: 8mm;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 6mm;
      }
      .front .hero .names .latin {
        font-family: var(--display);
        font-weight: 800;
        font-size: 26pt;
        letter-spacing: -0.025em;
        line-height: 0.96;
        display: block;
      }
      .front .hero .names .jp {
        display: block;
        margin-top: 1.6mm;
        font-family: var(--jp);
        font-weight: 400;
        font-size: 11pt;
        color: var(--ink-mid);
        letter-spacing: 0.18em;
      }
      .front .statement {
        margin-top: auto;
        margin-bottom: 2.2mm;
        font-family: var(--display);
        font-size: 6.5pt;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-mid);
        line-height: 1.4;
      }
      .front .statement .sep {
        color: var(--ink-faint);
        display: inline-block;
        width: 1.6em;
        text-align: center;
      }

      /* ============== BACK ============== */
      .back .meta {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .back .body {
        margin-top: 4mm;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .back .tagline {
        font-family: var(--jp);
        font-weight: 700;
        font-size: 17pt;
        line-height: 1.12;
        letter-spacing: 0.01em;
        color: var(--ink);
        margin: 0;
      }
      .back .tagline .accent-word {
        color: var(--accent);
        font-style: italic;
      }
      .back .paraphrase {
        margin-top: 2.5mm;
        font-family: var(--display);
        font-style: italic;
        font-weight: 400;
        font-size: 8.5pt;
        letter-spacing: 0.10em;
        word-spacing: 0.14em;
        color: var(--ink-mid);
      }
      .back .paraphrase .slash {
        word-spacing: 0.16em;
      }
      .back .wordmark {
        margin-top: auto;
        font-family: var(--display);
        font-weight: 800;
        font-size: 22pt;
        letter-spacing: -0.025em;
        line-height: 1;
        color: var(--ink);
      }
      .back .wordmark .accent { color: var(--accent); }
    </style>
  </head>

  <body>
    <article class="card front">
      <div class="frame">
        <div class="meta">
          <span class="label ink-faint"><span class="accent">§</span> IDENTITY</span>
        </div>
        <hr class="rule" style="margin-top: 1.6mm" />
        <div class="hero">
          <div class="names">
            <span class="latin">ABE SHINJI</span>
            <span class="jp">安部&nbsp;&nbsp;新司</span>
          </div>
        </div>
        <p class="statement">
          OSINT<span class="sep">·</span>Machine&nbsp;Learning<span class="sep">·</span>Information&nbsp;Theory
        </p>
        <div class="contact">
          <span class="email">4beshinji@gmail.com</span>
          <span class="accent">§</span>
        </div>
      </div>
    </article>

    <article class="card back">
      <div class="frame">
        <div class="meta">
          <span class="label ink-faint"><span class="accent">§</span> MISSION</span>
        </div>
        <hr class="rule" style="margin-top: 1.6mm" />
        <div class="body">
          <h2 class="tagline">
            もつれた課題を、<br />
            <span class="accent-word">解きほぐす。</span>
          </h2>
          <p class="paraphrase"><span class="slash">// </span>untangle what is tangled</p>
        </div>
        <div class="wordmark">TangleTeck<span class="accent">.</span></div>
        <div class="foot">
          <span class="url">tangle-tech.com</span>
          <span class="accent">§</span>
        </div>
      </div>
    </article>
  </body>
</html>
